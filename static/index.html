<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script>
  const token = localStorage.getItem('azon_token');
  const user = JSON.parse(localStorage.getItem('azon_user') || 'null');
  if (token && user) {
    window.location.href = user.role === 'admin' ? '/admin.html' : '/user.html';
  } else {
    window.location.href = '/login.html';
  }
</script>
</head>
</html>
