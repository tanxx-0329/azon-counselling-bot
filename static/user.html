<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZON Parent Support</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --primary:#16a34a; --primary-dark:#15803d; --primary-light:#dcfce7;
  --bg:#f8fafc; --border:#e2e8f0; --text:#1e293b; --muted:#64748b;
}
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; display:flex; }
.sidebar { width:260px; background:#fff; border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; overflow:hidden; transition:width .25s ease; }
.sidebar.collapsed { width:0; border-right:none; }
.sidebar-inner { width:260px; padding:24px 20px; display:flex; flex-direction:column; height:100%; overflow-y:auto; }
.sidebar img { max-width:100px; margin-bottom:12px; }
.sidebar h2 { font-size:15px; font-weight:600; margin-bottom:4px; }
.user-badge { display:inline-flex; align-items:center; gap:6px; background:var(--primary-light); color:var(--primary-dark); padding:4px 10px; border-radius:20px; font-size:12px; font-weight:500; margin-bottom:14px; }
.sidebar p { font-size:13px; color:var(--muted); line-height:1.5; margin-bottom:14px; }
.divider { height:1px; background:var(--border); margin:10px 0; }
.label { font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px; }
.helpline { background:#fef2f2; border:1px solid #fecaca; border-radius:8px; padding:10px 12px; margin-bottom:12px; }
.helpline-name { font-size:12px; color:#dc2626; font-weight:500; }
.helpline-num { font-size:22px; font-weight:700; color:#dc2626; }
.sidebar a { color:var(--primary); text-decoration:none; font-size:13px; }
.logout-btn { margin-top:auto; padding:9px; border:1px solid var(--border); border-radius:8px; background:none; cursor:pointer; font-size:13px; color:var(--muted); }
.logout-btn:hover { background:var(--bg); }
.main { flex:1; display:flex; flex-direction:column; background:#fff; overflow:hidden; min-width:0; }
.header { padding:16px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
.toggle-sidebar { background:none; border:1px solid var(--border); border-radius:8px; padding:6px 10px; cursor:pointer; font-size:16px; color:var(--muted); }
.toggle-sidebar:hover { background:var(--bg); }
.header-text h1 { font-size:20px; font-weight:600; }
.header-text p { font-size:13px; color:var(--muted); margin-top:2px; }
.messages { flex:1; overflow-y:auto; padding:20px 28px; display:flex; flex-direction:column; gap:18px; }
.message { display:flex; gap:10px; align-items:flex-start; }
.message.user { flex-direction:row-reverse; }
.message.user .bubble { background:var(--admin); color:#fff; border-top-right-radius:4px; border-top-left-radius:16px; }
.avatar { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.avatar.assistant { background:var(--primary-light); }
.avatar.user { background:#dbeafe; }
.bubble { max-width:72%; padding:11px 15px; border-radius:16px; font-size:14px; line-height:1.65; white-space:pre-wrap; }
.message.assistant .bubble { background:#f1f5f9; border-top-left-radius:4px; }
.message.user .bubble { background:var(--primary); color:#fff; border-top-right-radius:4px; }
.sources { margin-top:4px; margin-left:44px; max-width:72%; }
.sources-btn { background:none; border:1px solid var(--border); border-radius:6px; padding:4px 9px; font-size:12px; color:var(--muted); cursor:pointer; }
.sources-list { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:7px 11px; margin-top:4px; font-size:12px; color:var(--muted); list-style:none; display:none; }
.sources-list li { padding:2px 0; }
.typing-dots { display:flex; gap:4px; padding:4px 0; }
.typing-dots span { width:7px; height:7px; background:var(--muted); border-radius:50%; animation:bounce 1.2s infinite; }
.typing-dots span:nth-child(2){animation-delay:.2s} .typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }
.input-area { padding:16px 28px; border-top:1px solid var(--border); }
.input-row { display:flex; gap:10px; align-items:center; background:var(--bg); border:1px solid var(--border); border-radius:24px; padding:7px 7px 7px 18px; }
.input-row:focus-within { border-color:var(--primary); box-shadow:0 0 0 3px rgba(22,163,74,.1); }
.input-row input { flex:1; border:none; background:none; font-size:14px; color:var(--text); outline:none; }
.input-row input::placeholder { color:var(--muted); }
.send-btn { width:34px; height:34px; background:var(--primary); color:#fff; border:none; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.send-btn:hover { background:var(--primary-dark); }
.send-btn:disabled { background:var(--border); cursor:not-allowed; }
.bubble table { border-collapse:collapse; width:100%; margin:8px 0; font-size:13px; }
.bubble th { background:#e2e8f0; padding:7px 10px; text-align:left; font-weight:600; border:1px solid #cbd5e1; }
.bubble td { padding:6px 10px; border:1px solid #e2e8f0; }
.bubble tr:nth-child(even) { background:#f8fafc; }
.bubble strong { font-weight:600; }
.bubble ul { padding-left:18px; margin:4px 0; }
.bubble li { margin:2px 0; }
.bubble p { margin:4px 0; }
</style>
</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-inner">
    <img src="https://azon.my/images/azon-psychologist-clinic-logo.svg" alt="AZON" onerror="this.style.display='none'">
    <h2>AZON Parent Support</h2>
    <div class="user-badge">👤 <span id="userName"></span></div>
    <p>A safe space to share your feelings and concerns about your child's wellbeing. You are not alone.</p>
    <div class="divider"></div>
    <div class="label">Need immediate help?</div>
    <div class="helpline">
      <div class="helpline-name">📞 Helpline HEAL</div>
      <div class="helpline-num">15555</div>
    </div>
    <div class="divider"></div>
    <div class="label">Recent chats</div>
    <div id="recentSessions" style="margin-bottom:12px">
      <div style="font-size:12px;color:var(--muted)">Loading...</div>
    </div>
    <button onclick="newChat()" style="width:100%;padding:8px;background:var(--primary-light);color:var(--primary-dark);border:none;border-radius:8px;font-size:13px;cursor:pointer;margin-bottom:12px">+ New chat</button>
    <div class="divider"></div>
    <div class="label">About AZON</div>
    <a href="https://azon.my" target="_blank">Visit our website →</a>
    <button class="logout-btn" onclick="logout()">Log out</button>
  </div>
</aside>

<main class="main">
  <div class="header">
    <button class="toggle-sidebar" onclick="toggleSidebar()">☰</button>
    <div class="header-text">
      <h1>🌿 AZON Parent Support</h1>
      <p>A safe space to share how you're feeling.</p>
    </div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <div class="input-row">
      <input type="text" id="msgInput" placeholder="Share what's on your mind..." onkeydown="if(event.key==='Enter')sendMessage()">
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2L15 22L11 13L2 9L22 2Z"/></svg>
      </button>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script>
let token = localStorage.getItem('azon_token');
let currentUser = JSON.parse(localStorage.getItem('azon_user') || 'null');
let busy = false;
let currentSessionId = null;
let sidebarOpen = true;

document.addEventListener('DOMContentLoaded', () => {
  if (!token || !currentUser || currentUser.role === 'admin') {
    window.location.href = '/login.html'; return;
  }
  document.getElementById('userName').textContent = currentUser.name;
  addMsg('assistant', `Hello ${currentUser.name}, and welcome. 💚\n\nI'm here to listen and support you. Parenting a child who is going through difficulties can be incredibly hard, and it's okay to not be okay.\n\nHow are you feeling today?`);
  loadRecentSessions();
});

function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  document.getElementById('sidebar').classList.toggle('collapsed', !sidebarOpen);
}

function logout() {
  localStorage.removeItem('azon_token');
  localStorage.removeItem('azon_user');
  window.location.href = '/login.html';
}

async function loadRecentSessions() {
  try {
    const res = await fetch('/api/sessions', { headers: {'Authorization': 'Bearer ' + token} });
    const sessions = await res.json();
    const container = document.getElementById('recentSessions');
    if (!sessions.length) { container.innerHTML = '<div style="font-size:12px;color:var(--muted)">No previous chats</div>'; return; }
    container.innerHTML = sessions.map(s => `
      <div onclick="loadSession(${s.id})" style="padding:7px 10px;border-radius:8px;cursor:pointer;font-size:12px;margin-bottom:4px;background:${currentSessionId===s.id?'var(--primary-light)':'transparent'};border:1px solid ${currentSessionId===s.id?'var(--primary)':'var(--border)'}">
        <div style="color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.preview}</div>
        <div style="color:var(--muted);font-size:11px;margin-top:2px">${new Date(s.created_at).toLocaleDateString()} · ${s.message_count} messages</div>
      </div>
    `).join('');
  } catch(e) { console.error(e); }
}

async function loadSession(sessionId) {
  const res = await fetch(`/api/sessions/${sessionId}/messages`, { headers: {'Authorization': 'Bearer ' + token} });
  const messages = await res.json();
  currentSessionId = sessionId;
  document.getElementById('messages').innerHTML = '';
  messages.forEach(m => addMsg(m.role === 'user' ? 'user' : 'assistant', m.content));
  loadRecentSessions();
}

function newChat() {
  currentSessionId = null;
  document.getElementById('messages').innerHTML = '';
  addMsg('assistant', `Hello ${currentUser.name}, and welcome. 💚\n\nHow are you feeling today?`);
  loadRecentSessions();
}

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const msg = input.value.trim();
  if (!msg || busy) return;
  addMsg('user', msg);
  input.value = '';
  busy = true;
  document.getElementById('sendBtn').disabled = true;
  const lid = showLoading();
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
      body: JSON.stringify({message: msg, session_id: currentSessionId})
    });
    const data = await res.json();
    removeLoading(lid);
    if (res.status === 401) { logout(); return; }
    if (!res.ok) throw new Error(data.detail || 'Error');
    addMsg('assistant', data.answer, data.sources);
    if (data.session_id) { currentSessionId = data.session_id; loadRecentSessions(); }
  } catch(e) {
    removeLoading(lid);
    addMsg('assistant', 'Something went wrong: ' + e.message);
  }
  busy = false;
  document.getElementById('sendBtn').disabled = false;
}

function addMsg(role, text, sources=[]) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'message ' + role;
  const av = document.createElement('div');
  av.className = 'avatar ' + role;
  av.textContent = role === 'user' ? '👤' : '🌿';
  const bub = document.createElement('div');
  bub.className = 'bubble';
  if (role === 'user') { bub.textContent = text; } else { bub.innerHTML = marked.parse(text); }
  div.appendChild(av); div.appendChild(bub);
  msgs.appendChild(div);
  if (sources && sources.length) {
    const sd = document.createElement('div'); sd.className = 'sources';
    const btn = document.createElement('button'); btn.className = 'sources-btn';
    btn.textContent = '📚 Sources (' + sources.length + ')';
    const ul = document.createElement('ul'); ul.className = 'sources-list';
    btn.onclick = () => ul.style.display = ul.style.display==='none'?'block':'none';
    sources.forEach(s => { const li=document.createElement('li'); li.textContent='📄 '+s; ul.appendChild(li); });
    sd.appendChild(btn); sd.appendChild(ul); msgs.appendChild(sd);
  }
  msgs.scrollTop = msgs.scrollHeight;
}

function showLoading() {
  const msgs = document.getElementById('messages');
  const id = 'l'+Date.now();
  const div = document.createElement('div'); div.className='message assistant'; div.id=id;
  const av = document.createElement('div'); av.className='avatar assistant'; av.textContent='🌿';
  const bub = document.createElement('div'); bub.className='bubble';
  bub.innerHTML='<div class="typing-dots"><span></span><span></span><span></span></div>';
  div.appendChild(av); div.appendChild(bub); msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return id;
}
function removeLoading(id) { const el=document.getElementById(id); if(el) el.remove(); }
</script>
</body>
</html>
